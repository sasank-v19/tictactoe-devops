<!DOCTYPE html>
<html>

<head>
    <title>TicTacToe DevOps PRO</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        
        h1 {
            margin-top: 20px;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .cell {
            width: 110px;
            height: 110px;
            background: #1e293b;
            border-radius: 12px;
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .2s;
        }
        
        .cell:hover {
            background: #334155;
        }
        
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        #modeSelect {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>🚀 TicTacToe DevOps Pro</h1>

    <div id="modeSelect">
        <h3>Select Mode</h3>
        <button onclick="startGame('human')">Human vs Human</button>
        <button onclick="startGame('computer')">Human vs Computer</button>
    </div>

    <h2 id="status"></h2>

    <div class="board" id="board"></div>

    <button onclick="resetGame()">Reset Game</button>

    <script>
        let mode = "human";

        const boardDiv = document.getElementById("board");
        const statusText = document.getElementById("status");

        function startGame(selectedMode) {
            mode = selectedMode;
            document.getElementById("modeSelect").style.display = "none";
            loadBoard();
        }

        function loadBoard() {
            fetch("/board")
                .then(res => res.json())
                .then(data => {
                    boardDiv.innerHTML = "";
                    statusText.innerText = "Current Player: " + data.player;

                    if (data.winner) {
                        statusText.innerText = "🏆 Winner is " + data.winner + " | Total Moves: " + data.board.filter(x => x != "").length;
                    }

                    data.board.forEach((cell, index) => {
                        const div = document.createElement("div");
                        div.className = "cell";
                        div.innerText = cell;
                        div.onclick = () => makeMove(index, data);
                        boardDiv.appendChild(div);
                    });
                });
        }

        function makeMove(position, data) {

            if (data.winner) return;

            fetch("/move", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        position: position
                    })
                })
                .then(() => {

                    if (mode === "computer") {
                        setTimeout(computerMove, 400);
                    }

                    loadBoard();
                });
        }

        function computerMove() {

            fetch("/board")
                .then(res => res.json())
                .then(data => {
                    if (data.winner) return;

                    let empty = [];
                    data.board.forEach((v, i) => {
                        if (v === "") empty.push(i);
                    });

                    if (empty.length > 0) {
                        let rand = empty[Math.floor(Math.random() * empty.length)];

                        fetch("/move", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                position: rand
                            })
                        }).then(() => loadBoard());
                    }
                });
        }

        function resetGame() {
            fetch("/reset", {
                method: "POST"
            }).then(() => {
                document.getElementById("modeSelect").style.display = "block";
                statusText.innerText = "";
                boardDiv.innerHTML = "";
            });
        }
    </script>

</body>

</html>
